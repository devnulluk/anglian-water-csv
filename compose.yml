services:
  water-ledger:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: http://localhost:8080
      TZ: Europe/London
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=700,uid=10001,gid=10001"]
    ulimits:
      core: 0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    logging:
      driver: none
    networks: [water-ledger]
networks:
  water-ledger:
    driver: bridge
