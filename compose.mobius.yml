services:
  water-ledger:
    image: ghcr.io/devnulluk/anglian-water-csv:${IMAGE_TAG:-0.1.0}
    container_name: anglian-water-csv
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact public HTTPS origin in Portainer}
      TZ: Europe/London
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8011}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks: [water-ledger]
networks:
  water-ledger:
    driver: bridge
