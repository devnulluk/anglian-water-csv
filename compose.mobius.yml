services:
  water-ledger:
    image: ghcr.io/devnulluk/anglian-water-csv:${IMAGE_TAG:-0.2.2}
    container_name: anglian-water-csv
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact public HTTPS origin in Portainer}
      TZ: Europe/London
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8011}:8080"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=700,uid=10001,gid=10001"]
    ulimits:
      core: 0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    logging:
      driver: none
    networks: [water-ledger]
networks:
  water-ledger:
    driver: bridge
